[project]
name = "dpg-audit"
version = "0.1.0"
description = "DreamPlanGo Route Audit Engine"
requires-python = ">=3.12"
dependencies = [
    "gpxpy>=1.6",
    "httpx>=0.27",
    "numpy>=2.1",
    "pydantic>=2.9",
    "pyproj>=3.7",
    "typer>=0.12",
]

[project.scripts]
dpg = "dpg_audit.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dpg_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # typer.Option(...) defaults are the idiomatic Typer style
